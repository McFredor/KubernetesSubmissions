apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
          
      containers:
        - name: log-writer
          image: fredor0k/log-writer:1.10
          env:
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files

        - name: log-reader
          image: fredor0k/log-reader:1.10
          env:
            - name: PORT
              value: "3000"
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files

        - name: pingpong
          image: fredor0k/pingpong:01
          env:
            - name: PORT
              value: "3001"
