apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-claim

      containers:
        - name: log-writer
          image: fredor0k/log-writer:1.11
          env:
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files

        - name: log-reader
          image: fredor0k/log-reader:1.11
          env:
            - name: PORT
              value: "3000"
            - name: FILE_PATH
              value: /usr/src/app/files/log.txt
            - name: PINGPONG_FILE_PATH
              value: /usr/src/app/files/pingpong.txt
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
