<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1fb;
      --card: #ffffff;
      --text: #2a2540;
      --muted: #7a7590;
      --accent1: #273278;
      --accent2: #134a13;
      --shadow: 0 10px 30px rgba(80, 60, 160, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 5rem 1rem 6rem;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      clip-path: ellipse(120% 100% at 50% 0%);
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: flotar 8s ease-in-out infinite;
    }
    .hero::before { width: 220px; height: 220px; top: -60px; left: -40px; }
    .hero::after  { width: 160px; height: 160px; bottom: 10px; right: -30px; animation-delay: -4s; }
    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(20px); }
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
    }
    .hero p { margin: 0.5rem 0 0; font-size: 1.1rem; opacity: 0.9; }

    /* Contenido */
    main {
      max-width: 900px;
      margin: -3rem auto 0;
      padding: 0 1rem;
      position: relative;
    }
    .foto {
      margin: 0 0 2rem;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .foto img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    /* Todos */
    .todos {
      margin: 0 0 3rem;
      padding: 1.5rem;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .todos h2 { margin: 0 0 1rem; font-weight: 600; }
    .todo-form { display: flex; gap: 0.5rem; }
    .todo-form input {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 1rem;
      font: inherit;
      color: var(--text);
      border: 2px solid #e2ddf0;
      border-radius: 10px;
      outline: none;
    }
    .todo-form input:focus { border-color: var(--accent1); }
    .todo-form button {
      padding: 0.7rem 1.4rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      cursor: pointer;
    }
    .todo-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .contador { margin: 0.3rem 0 1rem; font-size: 0.85rem; color: var(--muted); text-align: right; }
    .lista { list-style: none; margin: 0; padding: 0; }
    .lista li {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #eee9f7;
    }
    .lista li:last-child { border-bottom: none; }

  </style>
</head>
<body>
  <header class="hero">
    <h1>Todo App</h1>
    <p>Ñak Ñak...</p>
  </header>

  <main>
    <figure class="foto">
      <img src="/image" alt="Imagen aleatoria de Lorem Picsum">
    </figure>

    <section class="todos">
      <h2>Todos</h2>
      <form class="todo-form" id="todo-form">
        <input type="text" id="todo-input" name="todo" maxlength="140"
               placeholder="Nuevo todo (máx. 140 caracteres)" required>
        <button type="submit" id="todo-btn">Enviar</button>
      </form>
      <p class="contador"><span id="contador">0</span>/140</p>

      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <script>
    const MAX = 140;
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const btn = document.getElementById('todo-btn');
    const contador = document.getElementById('contador');
    const lista = document.getElementById('lista');

    function actualizarBoton() {
      const len = input.value.length;
      contador.textContent = len;
      btn.disabled = len === 0 || len > MAX;
    }
    input.addEventListener('input', actualizarBoton);
    btn.disabled = true;

    function agregarTodo(todo) {
      const li = document.createElement('li');
      li.textContent = todo.content;
      lista.appendChild(li);
    }

    // Los todos se obtienen y guardan en el servicio todo-backend.
    async function cargarTodos() {
      try {
        const res = await fetch('/todos');
        if (!res.ok) throw new Error(res.status);
        lista.replaceChildren();
        (await res.json()).forEach(agregarTodo);
      } catch (err) {
        console.error('No se pudieron cargar los todos:', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (content.length === 0 || content.length > MAX) return;

      btn.disabled = true;
      try {
        const res = await fetch('/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        if (!res.ok) throw new Error(await res.text());
        agregarTodo(await res.json());
        input.value = '';
      } catch (err) {
        console.error('No se pudo crear el todo:', err);
      }
      actualizarBoton();
    });

    cargarTodos();
  </script>

</body>
</html>
