<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1fb;
      --card: #ffffff;
      --text: #2a2540;
      --muted: #7a7590;
      --accent1: #273278;
      --accent2: #134a13;
      --shadow: 0 10px 30px rgba(80, 60, 160, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 5rem 1rem 6rem;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      clip-path: ellipse(120% 100% at 50% 0%);
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: flotar 8s ease-in-out infinite;
    }
    .hero::before { width: 220px; height: 220px; top: -60px; left: -40px; }
    .hero::after  { width: 160px; height: 160px; bottom: 10px; right: -30px; animation-delay: -4s; }
    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(20px); }
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
    }
    .hero p { margin: 0.5rem 0 0; font-size: 1.1rem; opacity: 0.9; }

    /* Contenido */
    main {
      max-width: 900px;
      margin: -3rem auto 0;
      padding: 0 1rem;
      position: relative;
    }
    .foto {
      margin: 0 0 2rem;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .foto img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }


  </style>
</head>
<body>
  <header class="hero">
    <h1>Todo App</h1>
    <p>Ñak Ñak...</p>
  </header>

  <main>
    <figure class="foto">
      <img src="/image" alt="Imagen aleatoria de Lorem Picsum">
    </figure>
  </main>

</body>
</html>
