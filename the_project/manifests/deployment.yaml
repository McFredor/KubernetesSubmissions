apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: the-project-claim

      containers:
        - name: the-project
          image: fredor0k/kube-project:2.2
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_PATH
              value: /usr/src/app/files/image.jpg
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
